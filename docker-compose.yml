services:
  postgres:
    image: postgres:17-alpine
    container_name: gothere-postgres
    environment:
      POSTGRES_USER: gothere
      POSTGRES_PASSWORD: gothere_local
      POSTGRES_DB: gothere
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - gothere-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gothere -d gothere"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  gothere-pgdata:
