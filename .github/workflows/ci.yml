name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  DATABASE_URL: postgres://gothere:gothere_ci@localhost:5432/gothere_test
  TEST_DATABASE_URL: postgres://gothere:gothere_ci@localhost:5432/gothere_test
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-0000
  BETTER_AUTH_URL: http://localhost:3100

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gothere
          POSTGRES_PASSWORD: gothere_ci
          POSTGRES_DB: gothere_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gothere -d gothere_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm boundaries
      - run: pnpm test:unit
      - run: pnpm test:integration
      - name: Migrations are in sync with the schema
        run: pnpm drizzle-kit check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: pnpm audit --prod --audit-level high
